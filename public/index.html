<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fresh Planner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <h1>Fresh Planner</h1>
      <p>Meal plans built around what is in stock and on offer today.</p>
    </div>
  </header>

  <main class="wrap">
    <section class="panel" aria-labelledby="chat-title">
      <h2 id="chat-title">Ask the meal assistant</h2>
      <div id="chat-log" class="chat-log" role="log" aria-live="polite"></div>
      <div id="chat-chips" class="chips"></div>
      <form id="chat-form" class="chat-form">
        <input id="chat-input" type="text" maxlength="500" autocomplete="off" aria-label="Your message"
               placeholder="e.g. 4 non-veg dinners around 600 calories, no mushrooms">
        <button type="submit" id="chat-send">Send</button>
      </form>
    </section>

    <section class="panel" aria-labelledby="form-title">
      <h2 id="form-title">Or use the form</h2>
      <form id="plan-form" class="form-grid">
        <label>Days
          <select name="days">
            <option>1</option><option>2</option><option>3</option><option>4</option>
            <option selected>5</option><option>6</option><option>7</option>
          </select>
        </label>
        <label>Diet
          <select name="diet">
            <option value="omnivore">Veg and non-veg</option>
            <option value="vegetarian">Vegetarian</option>
            <option value="vegan">Vegan</option>
            <option value="nonveg">Non-veg only</option>
          </select>
        </label>
        <label>Max calories per serving (optional)
          <input name="maxCalories" type="number" min="100" max="3000" step="50" inputmode="numeric" placeholder="e.g. 600">
        </label>
        <label>Budget in € (optional)
          <input name="budget" type="number" min="1" step="0.5" inputmode="decimal" placeholder="e.g. 25">
        </label>
        <label>Leave out (comma separated)
          <input name="exclude" type="text" placeholder="e.g. tofu, mozzarella">
        </label>
        <button type="submit" id="submit">Create plan</button>
      </form>
      <p id="error" class="error" role="alert" hidden></p>
    </section>

    <section id="results" class="panel" aria-live="polite" hidden></section>

    <section class="panel" aria-labelledby="deals-title">
      <h2 id="deals-title">Today's deals</h2>
      <ul id="deals" class="deals"></ul>
    </section>
  </main>

  <script type="module" src="app.js"></script>
  <script type="module" src="chat.js"></script>
</body>
</html>
